plugins { id 'com.android.application' }
android {
    namespace 'app.lawportal'
    compileSdk 34
    defaultConfig {
        applicationId project.findProperty('appId') ?: 'app.lawportal.client'
        minSdk 24
        targetSdk 34
        versionCode 511
        versionName '5.1.1'
        resValue 'string', 'app_name', project.findProperty('appName') ?: 'Law Portal'
        buildConfigField 'String', 'PORTAL_URL', '"' + (project.findProperty('portalUrl') ?: 'https://portal.kclegal.us') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
